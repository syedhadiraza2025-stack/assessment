databases:
  - name: assessment-db
    plan: free

services:
  - type: web
    name: assessment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage_db.py init
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: assessment-livekit-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python livekit_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
